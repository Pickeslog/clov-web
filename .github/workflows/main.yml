name: GCP-VM-CICD

on:
  push:
    branches: [deploy-myeongjun, deploy-chacha, deploy-lami, deploy-kimgyubi]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      # clov-api의 같은 워크플로를 그대로 옮겼다. 구조·스텝 순서·시크릿 이름 규칙은 동일하고,
      # 프론트라서 달라지는 자리에만 손을 댔다(주석으로 표시).
      #
      # api와 결정적으로 다른 점 하나: VITE_* 는 런타임 설정이 아니라 **빌드 시점에 번들
      # 문자열로 박힌다.** 그래서 사람별 시크릿(REACT_ENV_<이름>)이 하나 더 있고, api에서
      # 뺐던 "시크릿 주입" 스텝이 프론트에는 있어야 한다. 강사님 원본의 REACT_ENV 방식
      # (base64로 인코딩한 env 파일을 러너에서 풀어 쓰기)을 그대로 따랐다.
      - name: "환경변수 세팅"
        run: |
          if [ "${{github.ref}}" == 'refs/heads/deploy-myeongjun' ]; then
            echo "GCP_VM_HOST=${{secrets.GCP_VM_HOST_MYEONGJUN}}" >> $GITHUB_ENV
            echo "GCP_VM_USERNAME=${{secrets.GCP_VM_USERNAME_MYEONGJUN}}" >> $GITHUB_ENV
            echo "GCP_VM_SSHKEY<<KEY_EOF" >> $GITHUB_ENV
            echo "${{ secrets.GCP_VM_SSHKEY_MYEONGJUN }}" >> $GITHUB_ENV
            echo "KEY_EOF" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=${{secrets.DOCKER_USERNAME_MYEONGJUN}}" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=${{secrets.DOCKER_PASSWORD_MYEONGJUN}}" >> $GITHUB_ENV
            echo "REACT_ENV=${{secrets.REACT_ENV_MYEONGJUN}}" >> $GITHUB_ENV
          fi
          if [ "${{github.ref}}" == 'refs/heads/deploy-chacha' ]; then
            echo "GCP_VM_HOST=${{secrets.GCP_VM_HOST_CHACHA}}" >> $GITHUB_ENV
            echo "GCP_VM_USERNAME=${{secrets.GCP_VM_USERNAME_CHACHA}}" >> $GITHUB_ENV
            echo "GCP_VM_SSHKEY<<KEY_EOF" >> $GITHUB_ENV
            echo "${{ secrets.GCP_VM_SSHKEY_CHACHA }}" >> $GITHUB_ENV
            echo "KEY_EOF" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=${{secrets.DOCKER_USERNAME_CHACHA}}" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=${{secrets.DOCKER_PASSWORD_CHACHA}}" >> $GITHUB_ENV
            echo "REACT_ENV=${{secrets.REACT_ENV_CHACHA}}" >> $GITHUB_ENV
          fi
          if [ "${{github.ref}}" == 'refs/heads/deploy-lami' ]; then
            echo "GCP_VM_HOST=${{secrets.GCP_VM_HOST_LAMI}}" >> $GITHUB_ENV
            echo "GCP_VM_USERNAME=${{secrets.GCP_VM_USERNAME_LAMI}}" >> $GITHUB_ENV
            echo "GCP_VM_SSHKEY<<KEY_EOF" >> $GITHUB_ENV
            echo "${{ secrets.GCP_VM_SSHKEY_LAMI }}" >> $GITHUB_ENV
            echo "KEY_EOF" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=${{secrets.DOCKER_USERNAME_LAMI}}" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=${{secrets.DOCKER_PASSWORD_LAMI}}" >> $GITHUB_ENV
            echo "REACT_ENV=${{secrets.REACT_ENV_LAMI}}" >> $GITHUB_ENV
          fi
          if [ "${{github.ref}}" == 'refs/heads/deploy-kimgyubi' ]; then
            echo "GCP_VM_HOST=${{secrets.GCP_VM_HOST_KIMGYUBI}}" >> $GITHUB_ENV
            echo "GCP_VM_USERNAME=${{secrets.GCP_VM_USERNAME_KIMGYUBI}}" >> $GITHUB_ENV
            echo "GCP_VM_SSHKEY<<KEY_EOF" >> $GITHUB_ENV
            echo "${{ secrets.GCP_VM_SSHKEY_KIMGYUBI }}" >> $GITHUB_ENV
            echo "KEY_EOF" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=${{secrets.DOCKER_USERNAME_KIMGYUBI}}" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=${{secrets.DOCKER_PASSWORD_KIMGYUBI}}" >> $GITHUB_ENV
            echo "REACT_ENV=${{secrets.REACT_ENV_KIMGYUBI}}" >> $GITHUB_ENV
          fi
          
      # 원래 여기 있던 "Setup SSH Key"는 ~/.ssh/id_rsa를 만들었지만 아무도 읽지 않았다 —
      # appleboy/ssh-action은 with.key 입력만 쓰고 러너의 ~/.ssh는 보지도 않는다. 게다가
      # 검증줄이 `|| echo`로 끝나서 키가 깨져 있어도 스텝이 통과했고, 그래서 배포 실패의
      # 진짜 원인이 로그에 안 남았다(2026-07-30 GCP-VM-CICD #1·#2: 도커 push까지 성공한 뒤
      # SSH 스텝만 1초 만에 죽음). 값이 비었는지·개인키로 파싱되는지를 여기서 끊는다.
      #
      # 프론트는 검사 목록에 REACT_ENV를 더했다. 이게 비면 빌드가 실패하지 않고 레포의
      # .env.production(팀 공용 도메인)이 그대로 구워져서, 배포는 초록불인데 팀원 프론트가
      # 리더 백엔드를 호출하는 상태가 된다. 조용히 깨지므로 여기서 끊는 게 맞다.
      - name: 배포 시크릿 검증
        run: |
          missing=""
          for name in GCP_VM_HOST GCP_VM_USERNAME GCP_VM_SSHKEY DOCKER_USERNAME DOCKER_PASSWORD REACT_ENV; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          suffix=$(echo "${{ github.ref_name }}" | sed 's/^deploy-//' | tr '[:lower:]' '[:upper:]')
          if [ -n "$missing" ]; then
            echo "::error::'${{ github.ref_name }}' 브랜치에 필요한 시크릿이 비어 있다:$missing"
            echo "::error::Settings > Secrets and variables > Actions 에 <이름>_${suffix} 형태로 등록해야 한다(예: GCP_VM_HOST_${suffix})."
            exit 1
          fi
          keyfile=$(mktemp)
          printf '%s\n' "$GCP_VM_SSHKEY" > "$keyfile"
          chmod 600 "$keyfile"
          if ! ssh-keygen -y -f "$keyfile" > /dev/null 2>&1; then
            rm -f "$keyfile"
            echo "::error::GCP_VM_SSHKEY_${suffix} 를 개인키로 읽을 수 없다."
            echo "::error::공개키(.pub)를 넣었거나 줄바꿈이 사라진 경우가 대부분이다 — BEGIN/END 줄을 포함한 파일 전체를 그대로 붙여넣어야 한다."
            exit 1
          fi
          rm -f "$keyfile"
          echo "시크릿 6종 확인·개인키 파싱 OK (suffix=${suffix})"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{github.ref}}
          
      # ★ api에서는 이 주입 스텝을 뺐지만 프론트에는 있어야 한다.
      #
      # 백엔드는 시크릿을 이미지에 넣지 않고 VM의 /app/application-secret.yaml 을 런타임에
      # 마운트한다. 프론트는 그럴 수 없다 — Vite는 VITE_* 를 **빌드 시점에** 번들 문자열로
      # 치환하므로 컨테이너를 띄울 때 바꿀 방법이 없다.
      #
      # 레포의 .env.production 은 팀 공용 운영 도메인(clovlabcalss.store)을 가리킨다. 그대로
      # 빌드하면 팀원 4명의 프론트가 전부 리더 백엔드를 호출한다. 개인 도메인용
      # .env.production.local 은 .gitignore·.dockerignore(*.local)에 걸려 빌드 컨텍스트에
      # 못 들어오므로, 러너에서 .env.production 자체를 사람별 값으로 덮어쓴다.
      #
      # 덮어쓰는 건 러너의 임시 체크아웃뿐이고 레포 파일은 그대로다. .env.production 을
      # 커밋으로 개인 도메인으로 바꾸면 다음 팀 배포가 그 개인 서버를 향한다(#170).
      #
      # 강사님 원본은 `.env` 에 풀지만 우리 레포에서는 그러면 안 된다. 두 번 무력화된다 —
      # .dockerignore가 `.env` 를 빌드 컨텍스트에서 빼고, 설령 들어가도 Vite는 모드 파일
      # (.env.production)을 범용 파일(.env)보다 우선한다. 둘 다 결과가 같다: 팀 도메인이
      # 그대로 구워지고 워크플로는 초록불이다.
      #
      # 값은 시크릿이 아니다 — VITE_* 는 브라우저 번들에 평문으로 박히므로 애초에 시크릿을
      # 넣으면 안 되는 자리다(.env.example 참고). 그래서 로그에 그대로 찍어 확인할 수 있게 뒀다.
      - name: 환경파일 주입
        run: |
          echo "${{env.REACT_ENV}}" | base64 --decode > .env.production
          # base64가 깨졌거나 엉뚱한 파일을 인코딩했으면 여기서 끊는다. 그냥 두면 빈
          # .env.production 으로 빌드가 성공하고 localhost:8080 이 번들에 박힌다(#160).
          if ! grep -q '^VITE_API_BASE_URL=' .env.production; then
            echo "::error::REACT_ENV_<이름> 을 디코드한 결과에 VITE_API_BASE_URL 줄이 없다."
            echo "::error::.env.production 내용을 base64로 인코딩한 값을 넣어야 한다:"
            echo "::error::  echo \"VITE_API_BASE_URL=https://내도메인/api/v1\" | base64 | tr -d '\\n'"
            echo "::error::줄바꿈 없는 한 줄이어야 한다 — 여러 줄이면 앞의 '환경변수 세팅'에서 먼저 죽는다."
            exit 1
          fi
          echo "빌드에 들어갈 .env.production:"
          cat .env.production

      # 빌드(npm install + vite build)는 Dockerfile이 멀티스테이지로 안에서 수행한다 —
      # api가 Gradle을 이미지 안에서 돌리는 것과 같다. 러너에 Node를 깔 필요가 없다.
      - name: React Build and Docker image build and push
        run: |
          echo "${{env.DOCKER_PASSWORD}}" | docker login -u ${{env.DOCKER_USERNAME}} --password-stdin
          docker build -t ${{env.DOCKER_USERNAME}}/react-app:latest .
          docker push ${{env.DOCKER_USERNAME}}/react-app:latest

      # script_stop이 없으면 pull이 실패해도 뒤의 down/up이 그대로 돌아 "성공한 배포"로
      # 보이면서 옛 이미지가 다시 뜬다. 첫 줄에서 끊는다.
      - name: GCP SSH REMOTE 원격접속
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{env.GCP_VM_HOST}}
          username: ${{env.GCP_VM_USERNAME}}
          key: ${{env.GCP_VM_SSHKEY}}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          envs: DOCKER_USERNAME
          script: |
            cd /home/${{env.GCP_VM_USERNAME}}
            # VM의 compose가 방금 push한 이미지를 보고 있는지 먼저 확인한다. 이름이 다르면
            # pull이 "성공"하면서 옛 이미지를 그대로 다시 띄우고, 워크플로는 초록불이 된다.
            # 배포가 된 줄 알고 넘어가는 게 실패보다 나쁘다.
            # (2026-07-30 실제 사례: api 쪽에서 VM compose는 <아이디>/spring-app인데
            #  워크플로는 <아이디>/springboot-app을 밀고 있었다.)
            if ! grep -q "${DOCKER_USERNAME}/react-app" web-docker-compose.yaml; then
              echo "web-docker-compose.yaml이 ${DOCKER_USERNAME}/react-app 을 보고 있지 않다."
              echo "현재 image 줄:"
              grep -n 'image:' web-docker-compose.yaml
              exit 1
            fi
            sudo docker compose -f web-docker-compose.yaml pull
            # down을 쓰지 않는다. VM에서 api·web(nginx)·certbot이 같은 compose 프로젝트
            # 네트워크(<홈디렉터리>_default)를 공유하는데, down은 컨테이너를 지운 뒤 그
            # 네트워크까지 지우려 든다. 다른 서비스가 붙어 있어 실패하고, script_stop
            # 때문에 거기서 스크립트가 끊기면 web은 지워졌는데 다시 뜨지 않아 사이트가
            # 내려간다. 프론트는 web-docker-compose.yaml 안에 certbot도 같이 있어서 down이
            # 인증서 갱신 루프까지 끊는다. pull로 이미지가 바뀌면 up -d가 알아서 재생성한다.
            sudo docker compose -f web-docker-compose.yaml up -d
            sudo docker compose -f web-docker-compose.yaml ps

