<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 512 기준 모서리 반경 108 — 기존 썸네일 실측값 -->
    <clipPath id="round"><rect width="512" height="512" rx="108" ry="108"/></clipPath>

    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2f4f96"/>
      <stop offset="0.45" stop-color="#5c7fc2"/>
      <stop offset="0.78" stop-color="#9db7e0"/>
      <stop offset="1"    stop-color="#cfdcf2"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fdf6d2" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#e9edd8" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#cfdcf2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#c8d8f0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#night)"/>

    <!-- 별 -->
    <g fill="#ffffff">
      <circle cx="88"  cy="52"  r="2.6" opacity="0.9"/>
      <circle cx="150" cy="96"  r="1.8" opacity="0.7"/>
      <circle cx="216" cy="40"  r="2.2" opacity="0.85"/>
      <circle cx="410" cy="46"  r="2.4" opacity="0.9"/>
      <circle cx="462" cy="112" r="1.8" opacity="0.7"/>
      <circle cx="304" cy="30"  r="1.6" opacity="0.75"/>
      <circle cx="120" cy="150" r="1.6" opacity="0.6"/>
      <circle cx="368" cy="150" r="1.6" opacity="0.6"/>
      <circle cx="252" cy="86"  r="1.4" opacity="0.6"/>
    </g>

    <!-- 달 -->
    <g>
      <circle cx="316" cy="120" r="96" fill="url(#moonGlow)"/>
      <circle cx="316" cy="120" r="52" fill="#fbf3cf"/>
      <g fill="#eadfae" opacity="0.75">
        <circle cx="300" cy="106" r="11"/>
        <circle cx="332" cy="132" r="8"/>
        <circle cx="308" cy="142" r="6"/>
        <circle cx="336" cy="100" r="5"/>
      </g>
    </g>

    <!-- 먼 능선 -->
    <path d="M0 300 L70 268 L130 288 L196 254 L262 284 L330 260 L400 288 L466 264 L512 286 V330 H0 Z"
          fill="#7f9dd0" opacity="0.55"/>

    <!-- 중경 침엽수 띠 -->
    <g fill="#4d6cae" opacity="0.75">
      <path d="M96 330 L112 268 L128 330 Z"/>
      <path d="M140 330 L158 252 L176 330 Z"/>
      <path d="M186 330 L202 276 L218 330 Z"/>
      <path d="M296 330 L314 264 L332 330 Z"/>
      <path d="M340 330 L356 284 L372 330 Z"/>
      <path d="M382 330 L400 258 L418 330 Z"/>
    </g>

    <!-- 눈 덮인 바닥 + 오솔길 -->
    <path d="M0 322 Q128 344 256 330 Q384 344 512 320 V512 H0 Z" fill="url(#snow)"/>
    <path d="M238 330 Q252 400 196 512 L326 512 Q286 400 274 330 Z" fill="#ffffff" opacity="0.55"/>
    <g stroke="#b9cbe8" stroke-width="3" opacity="0.5" stroke-linecap="round">
      <path d="M60 392 Q130 380 200 392"/>
      <path d="M320 404 Q392 392 462 406"/>
      <path d="M96 458 Q150 448 206 458"/>
    </g>

    <!-- 왼쪽 큰 침엽수 -->
    <g fill="#3a5793">
      <path d="M74 400 L108 196 L142 400 Z"/>
      <path d="M78 344 L108 232 L138 344 Z" fill="#2f4a80"/>
      <path d="M8 420 L44 240 L80 420 Z"/>
      <path d="M12 366 L44 268 L76 366 Z" fill="#2f4a80"/>
    </g>
    <!-- 가지 위 눈 -->
    <g fill="#eaf2ff" opacity="0.85">
      <path d="M92 268 L108 240 L124 268 Z"/>
      <path d="M96 320 L108 296 L120 320 Z"/>
      <path d="M30 308 L44 280 L58 308 Z"/>
    </g>

    <!-- 오른쪽 큰 침엽수 -->
    <g fill="#3a5793">
      <path d="M370 400 L404 190 L438 400 Z"/>
      <path d="M374 342 L404 226 L434 342 Z" fill="#2f4a80"/>
      <path d="M436 424 L472 244 L508 424 Z"/>
      <path d="M440 370 L472 272 L504 370 Z" fill="#2f4a80"/>
    </g>
    <g fill="#eaf2ff" opacity="0.85">
      <path d="M388 262 L404 234 L420 262 Z"/>
      <path d="M392 316 L404 292 L416 316 Z"/>
      <path d="M458 312 L472 284 L486 312 Z"/>
    </g>

    <!-- 눈송이 -->
    <g fill="#ffffff">
      <circle cx="176" cy="228" r="3.2" opacity="0.9"/>
      <circle cx="238" cy="188" r="2.6" opacity="0.8"/>
      <circle cx="352" cy="212" r="3"   opacity="0.85"/>
      <circle cx="150" cy="300" r="2.6" opacity="0.75"/>
      <circle cx="430" cy="176" r="2.4" opacity="0.75"/>
      <circle cx="290" cy="260" r="2.4" opacity="0.7"/>
      <circle cx="204" cy="368" r="3"   opacity="0.8"/>
      <circle cx="358" cy="392" r="2.6" opacity="0.75"/>
    </g>

    <!-- 클로버 — 브랜드 마크. 겨울 배경에서도 읽히게 밝은 테두리 -->
    <g transform="translate(256 322)">
      <circle r="118" fill="url(#halo)"/>
      <g fill="#1f7a4c" stroke="#f2f8ff" stroke-width="5" stroke-linejoin="round">
        <g transform="rotate(-45) scale(0.86)"><path d="M0 0 C -26 -16 -50 -36 -50 -58 C -50 -80 -26 -92 -10 -80 C -5 -76 -2 -74 0 -70 C 2 -74 5 -76 10 -80 C 26 -92 50 -80 50 -58 C 50 -36 26 -16 0 0 Z"/></g>
        <g transform="rotate(45)  scale(0.86)"><path d="M0 0 C -26 -16 -50 -36 -50 -58 C -50 -80 -26 -92 -10 -80 C -5 -76 -2 -74 0 -70 C 2 -74 5 -76 10 -80 C 26 -92 50 -80 50 -58 C 50 -36 26 -16 0 0 Z"/></g>
        <g transform="rotate(135) scale(0.86)"><path d="M0 0 C -26 -16 -50 -36 -50 -58 C -50 -80 -26 -92 -10 -80 C -5 -76 -2 -74 0 -70 C 2 -74 5 -76 10 -80 C 26 -92 50 -80 50 -58 C 50 -36 26 -16 0 0 Z"/></g>
        <g transform="rotate(-135) scale(0.86)"><path d="M0 0 C -26 -16 -50 -36 -50 -58 C -50 -80 -26 -92 -10 -80 C -5 -76 -2 -74 0 -70 C 2 -74 5 -76 10 -80 C 26 -92 50 -80 50 -58 C 50 -36 26 -16 0 0 Z"/></g>
      </g>
      <path d="M4 52 Q14 88 -12 108" stroke="#1f7a4c" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M-40 -66 L-16 -30" stroke="#f2f8ff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>
</svg>
