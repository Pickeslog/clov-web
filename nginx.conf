# clov-web 컨테이너용 nginx — 정적 서빙 전용.
#
# /api·/oauth2·/login/oauth2 프록시는 이 파일에 넣지 않는다. 그건 호스트(또는 앞단 리버스
# 프록시)의 clov-api/deploy/nginx-clovlabcalss.conf 담당이고, 여기에 넣으면 백엔드 주소를
# 이미지에 굽게 돼서 환경마다 이미지를 다시 빌드해야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시 파일명 정적 자원은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 클라이언트 라우팅 ──
    # 이게 없으면 nginx가 /login·/rooms/24·/join/<code>를 실제 파일로 찾다가 404를 준다.
    # 새로고침·직접 접속·초대 링크가 전부 깨진다(#160).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
