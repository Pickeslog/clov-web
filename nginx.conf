# clov-web 컨테이너용 nginx — 정적 서빙 전용.
#
# /api·/oauth2·/login/oauth2 프록시는 이 파일에 넣지 않는다. 그건 호스트(또는 앞단 리버스
# 프록시)의 clov-api/deploy/nginx-clovlabcalss.conf 담당이고, 여기에 넣으면 백엔드 주소를
# 이미지에 굽게 돼서 환경마다 이미지를 다시 빌드해야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시 파일명 정적 자원은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 클라이언트 라우팅 ──
    # 이게 없으면 nginx가 /login·/rooms/24·/join/<code>를 실제 파일로 찾다가 404를 준다.
    # 새로고침·직접 접속·초대 링크가 전부 깨진다(#160).
    #
    # $uri/ (디렉터리 매칭)은 일부러 뺐다. 상점 아이템 아트가 /shop/costume-*.svg 절대경로로
    # 박혀 있어(2026-07-29-shop-item-art.sql) public/shop/ 실 디렉터리가 존재하는데, $uri/가
    # 있으면 라우트 /shop(파일 아님, 슬래시 없음)이 그 디렉터리와 매칭돼 index.html로 못 넘어가고
    # autoindex off라 403을 준다 — 로컬 dev 서버는 이 디렉터리 매칭이 없어 재현되지 않았다.
    # 실제 파일 요청(/shop/costume-*.svg)은 $uri 단계에서 이미 잡히므로 이 줄을 빼도 안전하다.
    location / {
        try_files $uri /index.html;
    }
}
